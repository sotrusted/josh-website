<form
  hx-post="{% url 'mailing_list_subscribe' %}"
  hx-target="#mailing-list-container"
  hx-swap="outerHTML"
  class="space-y-4">
  {% csrf_token %}

  <div>
    <label for="id_ml_name" class="block text-xs tracking-widest uppercase text-neutral-500 mb-2">Name</label>
    <input type="text" name="name" id="id_ml_name"
      class="w-full bg-neutral-900 border border-neutral-800 text-neutral-200 px-4 py-2.5 text-sm focus:outline-none focus:border-gold transition-colors">
  </div>

  <div>
    <label for="id_ml_email" class="block text-xs tracking-widest uppercase text-neutral-500 mb-2">Email *</label>
    <input type="email" name="email" id="id_ml_email" required
      class="w-full bg-neutral-900 border border-neutral-800 text-neutral-200 px-4 py-2.5 text-sm focus:outline-none focus:border-gold transition-colors{% if mailing_form.email.errors %} border-red-700{% endif %}">
    {% if mailing_form %}
      {% for error in mailing_form.email.errors %}
      <p class="text-xs text-red-400 mt-1">{{ error }}</p>
      {% endfor %}
    {% endif %}
  </div>

  <button type="submit"
    class="px-5 py-2.5 text-xs tracking-widest uppercase border border-gold text-gold hover:bg-gold hover:text-neutral-950 transition-colors">
    Subscribe
  </button>
</form>
