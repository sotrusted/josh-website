<form
  hx-post="{% url 'contact_submit' %}"
  hx-target="#contact-form-container"
  hx-swap="outerHTML"
  hx-indicator="#contact-spinner"
  class="space-y-5">
  {% csrf_token %}

  {% if form.errors %}
  <div class="text-sm text-red-400 border border-red-900 bg-red-950/30 px-4 py-3">
    Please correct the errors below.
  </div>
  {% endif %}

  {% for field in form %}
  <div>
    <label for="{{ field.id_for_label }}" class="block text-xs tracking-widest uppercase text-neutral-500 mb-2">
      {{ field.label }}{% if field.field.required %} *{% endif %}
    </label>
    {% if field.field.widget.input_type == 'textarea' %}
    <textarea
      name="{{ field.html_name }}"
      id="{{ field.id_for_label }}"
      rows="6"
      class="w-full bg-neutral-900 border border-neutral-800 text-neutral-200 px-4 py-3 text-sm focus:outline-none focus:border-gold transition-colors resize-none{% if field.errors %} border-red-700{% endif %}"
    >{{ field.value|default:'' }}</textarea>
    {% else %}
    <input
      type="{{ field.field.widget.input_type }}"
      name="{{ field.html_name }}"
      id="{{ field.id_for_label }}"
      value="{{ field.value|default:'' }}"
      class="w-full bg-neutral-900 border border-neutral-800 text-neutral-200 px-4 py-3 text-sm focus:outline-none focus:border-gold transition-colors{% if field.errors %} border-red-700{% endif %}"
    >
    {% endif %}
    {% for error in field.errors %}
    <p class="text-xs text-red-400 mt-1">{{ error }}</p>
    {% endfor %}
  </div>
  {% endfor %}

  <div class="flex items-center gap-4">
    <button type="submit"
      class="px-6 py-3 text-xs tracking-widest uppercase bg-gold text-neutral-950 hover:bg-amber-500 transition-colors font-medium">
      Send message
    </button>
    <span id="contact-spinner" class="htmx-indicator text-xs text-neutral-500">Sending…</span>
  </div>
</form>
